<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 700" width="1200" height="700" font-family="Helvetica, Arial, sans-serif">
  <title>Arquitetura do Ir Além: coleta por câmera, transmissão Wi-Fi e reconhecimento com o modelo da Entrega 1. Traço contínuo e selo verde indicam o caminho testado (iPhone pelo Safari, camera_server.py no Mac, cliente_vscode.py e caixas de volta ao celular); tracejado e selo cinza indicam o que foi implementado e não testado (ESP32-CAM, Raspberry Pi 5, webcam e Hailo-8L)</title>
  <defs>
    <marker id="seta" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse">
      <path d="M0,0 L10,5 L0,10 z" fill="#33413a"/>
    </marker>
    <marker id="seta-cinza" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse">
      <path d="M0,0 L10,5 L0,10 z" fill="#8a918c"/>
    </marker>
    <marker id="seta-volta" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse">
      <path d="M0,0 L10,5 L0,10 z" fill="#2e6a42"/>
    </marker>
    <marker id="seta-plus" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse">
      <path d="M0,0 L10,5 L0,10 z" fill="#7d8cc4"/>
    </marker>
  </defs>

  <rect width="1200" height="700" fill="#ffffff"/>

  <!-- título -->
  <text x="40" y="48" font-size="26" font-weight="700" fill="#18221b">FarmTech · Ir Além 3.1: visão do rover em tempo real</text>
  <text x="40" y="76" font-size="15" fill="#5a6a5e">Mesmo cliente no PC para os dois modos. BASE cumpre o enunciado; PLUS leva a inferência ao rover.</text>

  <!-- legenda: testado × implementado e não testado -->
  <g font-size="12.5">
    <rect x="826" y="22" width="350" height="64" rx="8" fill="#fafbfa" stroke="#d5dcd7"/>
    <line x1="842" y1="42" x2="884" y2="42" stroke="#2e6a42" stroke-width="2.2"/>
    <rect x="892" y="34" width="52" height="16" rx="8" fill="#2e6a42"/>
    <text x="918" y="46" font-size="10.5" font-weight="700" fill="#ffffff" text-anchor="middle">testado</text>
    <text x="952" y="46" fill="#33413a">iPhone/Safari → Mac (seção 7.1)</text>
    <line x1="842" y1="68" x2="884" y2="68" stroke="#8a918c" stroke-width="2" stroke-dasharray="6 4"/>
    <rect x="892" y="60" width="74" height="16" rx="8" fill="#e6e8e6" stroke="#b9bfba"/>
    <text x="929" y="72" font-size="10.5" font-weight="700" fill="#5a605c" text-anchor="middle">não testado</text>
    <text x="974" y="72" fill="#33413a">implementado, sem execução</text>
  </g>

  <!-- faixa BASE -->
  <rect x="24" y="100" width="1152" height="316" rx="14" fill="#f2f7f2" stroke="#cfe0d2"/>
  <text x="44" y="126" font-size="13" font-weight="700" fill="#2e6a42" letter-spacing="1.5">MODO BASE · FLUXO DO ENUNCIADO</text>

  <!-- fontes de câmera -->
  <g font-size="15" fill="#18221b">
    <rect x="44" y="146" width="240" height="74" rx="10" fill="#ffffff" stroke="#2e6a42" stroke-width="2"/>
    <text x="60" y="170" font-weight="700">iPhone · Safari (sem app)</text>
    <text x="60" y="190" font-size="13" fill="#5a6a5e">página /celular via QR code</text>
    <text x="60" y="208" font-size="13" fill="#5a6a5e">quadros JPEG por HTTPS/Wi-Fi</text>

    <rect x="44" y="234" width="240" height="46" rx="10" fill="#ffffff" stroke="#8a918c" stroke-width="1.5" stroke-dasharray="6 4"/>
    <text x="60" y="254" font-weight="700">ESP32-CAM</text>
    <text x="60" y="272" font-size="13" fill="#5a6a5e">OV2640 · /stream na porta 81</text>

    <rect x="44" y="294" width="240" height="46" rx="10" fill="#ffffff" stroke="#8a918c" stroke-width="1.5" stroke-dasharray="6 4"/>
    <text x="60" y="314" font-weight="700">Raspberry Pi 5 + câmera</text>
    <text x="60" y="332" font-size="13" fill="#5a6a5e">picamera2 · camera_server.py</text>

    <rect x="44" y="354" width="240" height="46" rx="10" fill="#ffffff" stroke="#8a918c" stroke-width="1.5" stroke-dasharray="6 4"/>
    <text x="60" y="374" font-weight="700">Webcam do PC</text>
    <text x="60" y="392" font-size="13" fill="#5a6a5e">local, sem rede (--fonte 0)</text>
  </g>
  <!-- selos das câmeras -->
  <g font-size="10.5" font-weight="700" text-anchor="middle">
    <rect x="226" y="138" width="52" height="16" rx="8" fill="#2e6a42"/>
    <text x="252" y="150" fill="#ffffff">testado</text>
    <rect x="204" y="226" width="74" height="16" rx="8" fill="#e6e8e6" stroke="#b9bfba"/>
    <text x="241" y="238" fill="#5a605c">não testado</text>
    <rect x="204" y="286" width="74" height="16" rx="8" fill="#e6e8e6" stroke="#b9bfba"/>
    <text x="241" y="298" fill="#5a605c">não testado</text>
    <rect x="204" y="346" width="74" height="16" rx="8" fill="#e6e8e6" stroke="#b9bfba"/>
    <text x="241" y="358" fill="#5a605c">não testado</text>
  </g>

  <!-- Wi-Fi -->
  <rect x="326" y="200" width="148" height="108" rx="30" fill="#ffffff" stroke="#33413a" stroke-width="1.5"/>
  <g fill="none" stroke="#2e6a42" stroke-width="3" stroke-linecap="round">
    <path d="M366 236 a48 48 0 0 1 68 0"/>
    <path d="M378 248 a30 30 0 0 1 44 0"/>
  </g>
  <circle cx="400" cy="260" r="4.5" fill="#2e6a42"/>
  <text x="400" y="284" font-size="16" font-weight="700" fill="#18221b" text-anchor="middle">Wi-Fi</text>
  <text x="400" y="299" font-size="11.5" fill="#5a6a5e" text-anchor="middle">MJPEG · HTTP(S)</text>

  <!-- câmeras → Wi-Fi -->
  <line x1="284" y1="190" x2="340" y2="224" stroke="#2e6a42" stroke-width="2.2" marker-end="url(#seta-volta)"/>
  <line x1="284" y1="258" x2="326" y2="256" stroke="#8a918c" stroke-width="1.8" stroke-dasharray="6 4" marker-end="url(#seta-cinza)"/>
  <line x1="284" y1="314" x2="340" y2="284" stroke="#8a918c" stroke-width="1.8" stroke-dasharray="6 4" marker-end="url(#seta-cinza)"/>

  <!-- camera_server.py no Mac (trilha do celular) -->
  <rect x="516" y="146" width="180" height="74" rx="10" fill="#ffffff" stroke="#2e6a42" stroke-width="2"/>
  <text x="532" y="170" font-size="14.5" font-weight="700" fill="#18221b">camera_server.py</text>
  <text x="532" y="190" font-size="12.5" fill="#5a6a5e">no Mac · --fonte navegador</text>
  <text x="532" y="208" font-size="12.5" fill="#5a6a5e">POST /quadro → /stream</text>
  <rect x="640" y="138" width="52" height="16" rx="8" fill="#2e6a42"/>
  <text x="666" y="150" font-size="10.5" font-weight="700" fill="#ffffff" text-anchor="middle">testado</text>

  <line x1="462" y1="230" x2="514" y2="200" stroke="#2e6a42" stroke-width="2.2" marker-end="url(#seta-volta)"/>
  <line x1="696" y1="200" x2="738" y2="214" stroke="#2e6a42" stroke-width="2.2" marker-end="url(#seta-volta)"/>

  <!-- ESP32-CAM e Pi: direto ao cliente -->
  <line x1="472" y1="262" x2="738" y2="262" stroke="#8a918c" stroke-width="1.8" stroke-dasharray="6 4" marker-end="url(#seta-cinza)"/>
  <text x="490" y="254" font-size="11.5" fill="#6b716d">ESP32-CAM e Pi: /stream direto ao cliente</text>

  <!-- volta das caixas para o celular -->
  <line x1="738" y1="172" x2="698" y2="166" stroke="#2e6a42" stroke-width="2" marker-end="url(#seta-volta)"/>
  <path d="M516 160 C 470 118, 340 120, 288 156" fill="none" stroke="#2e6a42" stroke-width="2" marker-end="url(#seta-volta)"/>
  <text x="300" y="180" font-size="12" fill="#2e6a42">detecções 0–1 → caixas no celular</text>

  <!-- PC -->
  <rect x="740" y="150" width="236" height="200" rx="12" fill="#ffffff" stroke="#2e6a42" stroke-width="2"/>
  <text x="756" y="178" font-size="17" font-weight="700" fill="#18221b">PC · VS Code</text>
  <text x="756" y="200" font-size="13.5" fill="#33413a">cliente_vscode.py</text>
  <rect x="756" y="212" width="204" height="54" rx="8" fill="#e2f2e6"/>
  <text x="768" y="236" font-size="14" font-weight="700" fill="#24753f">best.pt (Entrega 1)</text>
  <text x="768" y="256" font-size="12" fill="#33413a">YOLOv5 · 6 classes · .pt ou .onnx</text>
  <text x="756" y="290" font-size="12" fill="#5a6a5e">vaca · cobra · escorpiao</text>
  <text x="756" y="308" font-size="12" fill="#5a6a5e">arvore · cerca (mourão) · caneca</text>
  <text x="756" y="330" font-size="12" fill="#5a6a5e">FPS · latência (rede e inferência)</text>
  <rect x="902" y="142" width="70" height="16" rx="8" fill="#2e6a42"/>
  <text x="937" y="154" font-size="10.5" font-weight="700" fill="#ffffff" text-anchor="middle">testado</text>

  <path d="M284 378 C 470 412, 620 360, 738 334" fill="none" stroke="#8a918c" stroke-width="1.8" stroke-dasharray="6 4" marker-end="url(#seta-cinza)"/>
  <text x="470" y="404" font-size="11.5" fill="#6b716d">USB / OpenCV (local)</text>

  <!-- saídas -->
  <rect x="1030" y="150" width="130" height="92" rx="10" fill="#fbe3e0" stroke="#b3322a" stroke-width="1.5"/>
  <text x="1046" y="178" font-size="15" font-weight="700" fill="#b3322a">Alerta</text>
  <text x="1046" y="200" font-size="12.5" fill="#33413a">cobra ou</text>
  <text x="1046" y="218" font-size="12.5" fill="#33413a">escorpião</text>
  <text x="1046" y="234" font-size="11.5" fill="#5a6a5e">alertas.csv</text>

  <rect x="1030" y="258" width="130" height="92" rx="10" fill="#ffffff" stroke="#33413a" stroke-width="1.2"/>
  <text x="1046" y="286" font-size="15" font-weight="700" fill="#18221b">Evidências</text>
  <text x="1046" y="308" font-size="12.5" fill="#33413a">frames.csv</text>
  <text x="1046" y="326" font-size="12.5" fill="#33413a">prints (tecla s)</text>
  <text x="1046" y="342" font-size="11.5" fill="#5a6a5e">→ notebook</text>

  <line x1="976" y1="214" x2="1028" y2="198" stroke="#33413a" stroke-width="1.8" marker-end="url(#seta)"/>
  <line x1="976" y1="290" x2="1028" y2="302" stroke="#33413a" stroke-width="1.8" marker-end="url(#seta)"/>

  <!-- faixa PLUS (implementada, não testada) -->
  <rect x="24" y="430" width="1152" height="214" rx="14" fill="#f2f4fa" stroke="#c9d2f0" stroke-dasharray="8 5"/>
  <text x="44" y="456" font-size="13" font-weight="700" fill="#3d55a8" letter-spacing="1.5">MODO PLUS · INFERÊNCIA EMBARCADA NO ROVER (IMPLEMENTADO, NÃO TESTADO)</text>

  <rect x="44" y="476" width="240" height="72" rx="10" fill="#ffffff" stroke="#7d8cc4" stroke-width="1.5" stroke-dasharray="6 4"/>
  <text x="60" y="502" font-size="15" font-weight="700" fill="#18221b">Câmera do Pi</text>
  <text x="60" y="522" font-size="13" fill="#5a6a5e">picamera2 · no próprio rover</text>
  <text x="60" y="540" font-size="13" fill="#5a6a5e">quadros não saem para inferir</text>

  <rect x="330" y="470" width="300" height="88" rx="12" fill="#ffffff" stroke="#7d8cc4" stroke-width="1.8" stroke-dasharray="6 4"/>
  <text x="346" y="496" font-size="16" font-weight="700" fill="#18221b">Raspberry Pi 5 + Hailo-8L</text>
  <text x="346" y="516" font-size="13" fill="#33413a">best.pt → ONNX → best.hef (INT8)</text>
  <text x="346" y="534" font-size="13" fill="#33413a">13 TOPS · NMS no chip · anota o quadro</text>
  <text x="346" y="550" font-size="11.5" fill="#5a6a5e">camera_server.py --inferencia hailo</text>
  <rect x="550" y="462" width="74" height="16" rx="8" fill="#e6e8e6" stroke="#b9bfba"/>
  <text x="587" y="474" font-size="10.5" font-weight="700" fill="#5a605c" text-anchor="middle">não testado</text>

  <rect x="330" y="574" width="300" height="56" rx="10" fill="#ffffff" stroke="#7d8cc4" stroke-width="1.2" stroke-dasharray="6 4"/>
  <text x="346" y="598" font-size="14" font-weight="700" fill="#3d55a8">Plano B · ONNX Runtime na CPU</text>
  <text x="346" y="617" font-size="12.5" fill="#5a6a5e">--inferencia onnx · simulado só no Mac</text>

  <line x1="284" y1="512" x2="328" y2="512" stroke="#7d8cc4" stroke-width="1.8" stroke-dasharray="6 4" marker-end="url(#seta-plus)"/>
  <line x1="480" y1="574" x2="480" y2="561" stroke="#7d8cc4" stroke-width="1.4" stroke-dasharray="4 3" marker-end="url(#seta-plus)"/>

  <rect x="690" y="476" width="240" height="72" rx="10" fill="#ffffff" stroke="#7d8cc4" stroke-width="1.5" stroke-dasharray="6 4"/>
  <text x="706" y="502" font-size="15" font-weight="700" fill="#18221b">Wi-Fi</text>
  <text x="706" y="522" font-size="13" fill="#33413a">/stream vídeo já anotado</text>
  <text x="706" y="540" font-size="13" fill="#33413a">/deteccoes JSON</text>

  <line x1="630" y1="512" x2="688" y2="512" stroke="#7d8cc4" stroke-width="1.8" stroke-dasharray="6 4" marker-end="url(#seta-plus)"/>
  <path d="M930 500 C 990 468, 900 390, 870 354" fill="none" stroke="#7d8cc4" stroke-width="2" stroke-dasharray="6 4" marker-end="url(#seta-plus)"/>
  <text x="962" y="482" font-size="12.5" fill="#3d55a8">mesmo cliente,</text>
  <text x="962" y="499" font-size="12.5" fill="#3d55a8">sem --modelo</text>

  <text x="690" y="580" font-size="13" fill="#33413a">Por que o plus: inferência local no rover,</text>
  <text x="690" y="599" font-size="13" fill="#33413a">sem depender de PC ou nuvem no pasto;</text>
  <text x="690" y="618" font-size="13" fill="#33413a">só alertas e vídeo trafegam pela rede.</text>

  <!-- rodapé -->
  <text x="40" y="676" font-size="12.5" fill="#33413a">Caminho testado: iPhone (Safari) → Wi-Fi → camera_server.py no Mac → cliente_vscode.py com o best.onnx → caixas de volta à tela do celular.</text>
</svg>
